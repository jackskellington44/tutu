<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutu Tarot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="app-title">✨ Tutu Tarot</h1>
    </header>

    <main>
        <section class="home-section">
            <button class="random-btn" onclick="drawRandomCard()">🎴 Draw a Random Card</button>
        </section>

        <section class="home-section">
            <h2 class="section-label">Browse by Suit</h2>
            <div class="suit-grid">
                <button class="suit-btn" onclick="goToList('major')">🌟 Major Arcana</button>
                <button class="suit-btn" onclick="goToList('wands')">🔥 Wands</button>
                <button class="suit-btn" onclick="goToList('pentacles')">🌿 Pentacles</button>
                <button class="suit-btn" onclick="goToList('cups')">💧 Cups</button>
                <button class="suit-btn" onclick="goToList('swords')">💨 Swords</button>
            </div>
        </section>

        <section class="home-section" id="history-section" style="display:none">
            <h2 class="section-label">Recent Draws</h2>
            <div id="history-list"></div>
            <button class="clear-btn" onclick="clearHistory()">Clear History</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
