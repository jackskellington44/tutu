<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Detail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button class="back-btn" onclick="history.back()">← Back</button>
        <h1 class="app-title" id="card-title">Loading...</h1>
    </header>

    <main>
        <div id="error-box" class="error-box" style="display:none">
            <p id="error-msg">Failed to load card.</p>
            <button onclick="loadDetailPage()">Retry</button>
        </div>

        <div id="card-display" style="display:none">
            <div class="card-image" id="card-image"></div>
            <div class="orientation-badge" id="orientation-badge"></div>
            <div class="description-box" id="description-box"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
